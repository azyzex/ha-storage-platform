# Falco: runtime threat detection from kernel syscalls (modern eBPF probe, no kernel module to build).
# k3s keeps containerd's socket under /run/k3s, so point the container metadata collector there.
driver:
  kind: modern_ebpf

collectors:
  docker: { enabled: false }
  crio: { enabled: false }
  containerd: { enabled: true, socket: /run/k3s/containerd/containerd.sock }
  # newer chart layout (container plugin); unused keys are ignored by older charts
  containerEngine:
    enabled: true
    engines:
      docker: { enabled: false }
      podman: { enabled: false }
      containerd: { enabled: true, sockets: ["/run/k3s/containerd/containerd.sock"] }
      cri: { enabled: true, sockets: ["/run/k3s/containerd/containerd.sock"] }

tty: true
falco:
  json_output: true
  json_include_output_property: true

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 512Mi }

# Platform-specific rule: our images never need an interactive shell at runtime, so any shell started inside
# a container of the "ha" namespace is suspicious (kubectl exec by a human, or an attacker after an RCE).
customRules:
  ha-storage-rules.yaml: |-
    - list: ha_storage_images
      items: [docker.io/ha-storage/api, docker.io/ha-storage/frontend, ha-storage/api, ha-storage/frontend]

    - rule: Shell spawned in an HA Storage container
      desc: >
        A shell started inside an API or frontend container. The images never need one at runtime,
        so this is either manual access (kubectl exec) or post-exploitation activity.
      condition: >
        spawned_process and container and proc.name in (shell_binaries)
        and (container.image.repository in (ha_storage_images) or k8s.ns.name = "ha")
      output: >
        Shell in HA Storage container (pod=%k8s.pod.name ns=%k8s.ns.name image=%container.image.repository
        user=%user.name cmd=%proc.cmdline parent=%proc.pname)
      priority: WARNING
      tags: [ha-storage, container, mitre_execution, T1059]

# Forward alerts to the platform's Alertmanager (same routing as the Prometheus alerts) when it is installed.
falcosidekick:
  enabled: true
  config:
    alertmanager:
      hostport: http://kps-alertmanager.monitoring:9093
      minimumpriority: warning
