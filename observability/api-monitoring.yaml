# Scrape the API pods' /metrics (HTTP metrics + the storage probe).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api
  namespace: ha
spec:
  selector: { matchLabels: { app: api } }
  endpoints:
    - port: http
      path: /metrics
      interval: 10s
---
# Grafana under /grafana on the same entry point as the app (explicit priority, see k8s/ingress.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "90"
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend: { service: { name: kps-grafana, port: { number: 80 } } }
