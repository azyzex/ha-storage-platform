# Zero-trust inside the namespace: nothing may talk to anything unless a rule allows it.
# k3s enforces NetworkPolicies with its embedded kube-router controller.

# 1. Deny all incoming traffic to every pod in "ha" by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: ha }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# 2. The ingress controller (Traefik, in kube-system) may reach the web-facing pods only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-ingress-controller, namespace: ha }
spec:
  podSelector:
    matchExpressions: [{ key: app, operator: In, values: [api, frontend] }]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
---
# 3. Prometheus (namespace "monitoring") may scrape the API metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-prometheus-scrape, namespace: ha }
spec:
  podSelector: { matchLabels: { app: api } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports: [{ protocol: TCP, port: 8000 }]
---
# 4. Only the API may reach PostgreSQL, and only on 5432.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: postgres-from-api-only, namespace: ha }
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: api } } }]
      ports: [{ protocol: TCP, port: 5432 }]
---
# 5. The backup and restore jobs may reach PostgreSQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: postgres-from-backup, namespace: ha }
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: backup } } }]
      ports: [{ protocol: TCP, port: 5432 }]
