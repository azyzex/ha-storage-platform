# PostgreSQL holds metadata only. Its data sits on a local-path volume, NOT on GlusterFS:
# a distributed file system is a poor fit for database I/O (latency, locking).
# The password comes from the "postgres-credentials" Secret, created by scripts/cluster-up.sh (never committed).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ha
  labels: { app: postgres }
spec:
  selector: { app: postgres }
  ports: [{ name: pg, port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ha
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: storage }
            - { name: POSTGRES_DB, value: storage }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432, name: pg }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "storage", "-d", "storage"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "storage", "-d", "storage"] }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: { requests: { storage: 1Gi } }
