# Stateless API. Every k3d node has the GlusterFS volume bind-mounted at /mnt/gluster,
# so any pod on any node sees the same files. Two replicas, spread across nodes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ha
  labels: { app: api }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: api }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: api } }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ha-storage/api:local
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: password } }
            - { name: DATABASE_URL, value: "postgresql://storage:$(POSTGRES_PASSWORD)@postgres:5432/storage" }
            - { name: DATA_DIR, value: /data }
          ports: [{ containerPort: 8000, name: http }]
          readinessProbe:
            httpGet: { path: /api/readyz, port: http }
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: files, mountPath: /data }
            - { name: tmp, mountPath: /tmp }   # upload spooling (root filesystem is read-only)
      volumes:
        - name: files
          hostPath: { path: /mnt/gluster, type: Directory }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ha
  labels: { app: api }
spec:
  selector: { app: api }
  ports: [{ name: http, port: 8000, targetPort: http }]
