# Garage: self-hosted S3-compatible object storage, the backup target.
# (MinIO stopped publishing community container images in 2025; Garage is maintained and lightweight.)
# Lives in its own namespace, separate from the data it protects. RPC secret comes from a Secret created by
# scripts/backup-up.sh.
apiVersion: v1
kind: Namespace
metadata: { name: backup }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: garage-config, namespace: backup }
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 1
    rpc_bind_addr = "0.0.0.0:3901"
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "0.0.0.0:3900"
    root_domain = ".s3.garage.localhost"

    [admin]
    api_bind_addr = "0.0.0.0:3903"
---
apiVersion: v1
kind: Service
metadata: { name: garage, namespace: backup }
spec:
  selector: { app: garage }
  ports: [{ name: s3, port: 3900, targetPort: 3900 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: garage, namespace: backup }
spec:
  serviceName: garage
  replicas: 1
  selector: { matchLabels: { app: garage } }
  template:
    metadata: { labels: { app: garage } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: garage
          image: dxflrs/garage:v2.5.0
          env:
            - { name: GARAGE_CONFIG_FILE, value: /etc/garage/garage.toml }
            - name: GARAGE_RPC_SECRET
              valueFrom: { secretKeyRef: { name: garage-secrets, key: rpc-secret } }
          ports: [{ containerPort: 3900, name: s3 }]
          readinessProbe: { tcpSocket: { port: s3 }, periodSeconds: 5 }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/garage }
            - { name: data, mountPath: /var/lib/garage }
      volumes:
        - { name: config, configMap: { name: garage-config } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: { requests: { storage: 5Gi } }
