name: ci
on:
  push:
  workflow_dispatch:

jobs:
  lint-scan:
    name: Lint + Python security scan
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: app/api } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q ruff==0.8.4 bandit==1.8.0
      - name: Ruff (lint)
        run: ruff check .
      - name: Bandit (Python security issues, medium+ severity fails the build)
        run: bandit -r app -ll

  security:
    name: DevSecOps gates (gitleaks, Trivy images + Kubernetes config)
    runs-on: ubuntu-24.04
    env:
      TRIVY: aquasec/trivy:0.58.1
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }          # scan the whole Git history for leaked secrets
      - name: gitleaks — no secrets in any commit
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 git /repo --redact --verbose
      - name: Build images
        run: |
          docker build -q -t ha-storage/api:local app/api
          docker build -q -t ha-storage/frontend:local app/frontend
          docker build -q -t ha-storage/aiops-detector:local aiops
      - name: Trivy — images (fail on fixable CRITICAL vulnerabilities)
        run: |
          for img in ha-storage/api:local ha-storage/frontend:local ha-storage/aiops-detector:local; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY" \
              image --quiet --exit-code 1 --severity CRITICAL --ignore-unfixed "$img"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY" \
              image --quiet --exit-code 0 --severity HIGH,CRITICAL --format table "$img" | tail -n 25
          done
      - name: Trivy — Kubernetes manifests (fail on HIGH/CRITICAL misconfigurations)
        run: |
          docker run --rm -v "$PWD:/src" "$TRIVY" config --quiet --exit-code 1 --severity HIGH,CRITICAL \
            --ignorefile /src/.trivyignore /src/k8s
          docker run --rm -v "$PWD:/src" "$TRIVY" config --quiet --exit-code 1 --severity HIGH,CRITICAL             --ignorefile /src/.trivyignore /src/backup

  aiops-tests:
    name: Anomaly detector unit tests
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: aiops } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt pytest==8.3.4 ruff==0.8.4 bandit==1.8.0
      - run: ruff check . && bandit -q -r detector.py -ll
      - run: python -m pytest -q tests

  api-tests:
    name: API tests (real PostgreSQL)
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: app/api } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: storage, POSTGRES_PASSWORD: storage, POSTGRES_DB: storage }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U storage" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://storage:storage@localhost:5432/storage
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements-dev.txt
      - run: python -m pytest -q

  storage-smoke:
    name: Slices 0+2 — GlusterFS (built by Ansible) survives a node failure
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Start 3-node GlusterFS cluster (Ansible) + idempotency check
        run: bash scripts/storage-up.sh --check-idempotent
      - name: Mount volume on the host (FUSE)
        run: bash scripts/storage-mount.sh
      - name: Failover + self-heal test
        run: bash scripts/storage-smoke.sh
      - name: Diagnostics on failure
        if: failure()
        run: |
          for n in gluster-1 gluster-2 gluster-3; do echo "--- $n"; docker logs --tail 80 $n || true; done

  e2e:
    name: Platform end-to-end (Kubernetes, failover, NetworkPolicy, observability, backups, AIOps, load)
    needs: [api-tests, storage-smoke, aiops-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space (runner ships ~25 GB of unused toolchains)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af >/dev/null
          df -h /
      - name: Storage layer
        run: bash scripts/storage-up.sh && bash scripts/storage-mount.sh
      - name: k3d cluster + deploy
        run: bash scripts/cluster-up.sh
      - name: End-to-end failover test
        run: bash scripts/e2e.sh
      - name: Observability stack (Prometheus, Grafana, Alertmanager)
        run: bash scripts/observability-up.sh
      - name: Observability test (alert on node failure)
        run: bash scripts/observability-test.sh
      - name: Backups (Garage S3 + restic CronJob)
        run: bash scripts/backup-up.sh
      - name: Disaster-recovery drill (accidental delete -> restore)
        run: bash scripts/restore-drill.sh
      - name: AIOps anomaly detector
        run: bash scripts/aiops-up.sh
      - name: AIOps gray-failure test (slow node, not down)
        run: bash scripts/aiops-test.sh
      - name: Load test + chaos (k6, HPA autoscaling, node killed under load)
        run: bash scripts/load-test.sh
      - name: Diagnostics on failure
        if: failure()
        run: |
          free -m || true
          df -h / || true
          kubectl describe nodes | grep -A8 "Conditions:" || true
          kubectl -n monitoring get pods -o wide || true
          kubectl -n monitoring logs deploy/aiops-detector --tail=40 || true
          kubectl -n ha get hpa -o wide || true
          kubectl get all -A -o wide || true
          kubectl -n ha describe pods || true
          kubectl -n ha logs deploy/api --tail=100 || true
          kubectl -n ha logs statefulset/postgres --tail=50 || true
